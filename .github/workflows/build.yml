# SPDX-License-Identifier: CC0-1.0
#
# GitHub Actions workflow for Kdenlive WebSocket Fork
# Builds Windows exe and Linux AppImage using KDE CraftMaster
#
# Based on: https://github.com/owncloud/client/blob/master/.github/workflows/main.yml

name: Build Kdenlive WebSocket

on:
  push:
    tags:
      - 'v*'                    # Release builds on version tags only
  workflow_dispatch:            # Manual trigger for testing

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  # ===========================================================================
  # Build Job - Windows and Linux
  # ===========================================================================
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false          # Continue other builds if one fails
      matrix:
        include:
          - name: windows-x86_64
            target: windows-cl-msvc2022-x86_64
            # windows-latest is now windows-2025-vs2026 (VS 18.x) which Craft
            # cannot detect (it only searches VS 16-18 in [17,18) range);
            # pin to windows-2022 so VS 2022 (v143) is found.
            os: windows-2022

          - name: linux-x86_64
            target: linux-64-gcc
            os: ubuntu-24.04
            # Run directly on runner - Craft handles dependencies

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      CRAFT_TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Let Qt's pkg-config find the runner's system xkbcommon (xkbcommon-x11.pc)
      PKG_CONFIG_PATH: ${{ matrix.target == 'linux-64-gcc' && '/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig' || '' }}

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # Full history for version detection

      # -----------------------------------------------------------------------
      # Setup Python
      # -----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # Restore Craft cache
      # -----------------------------------------------------------------------
      - name: Restore Craft cache
        uses: actions/cache@v6
        with:
          path: ~/cache
          key: craft-${{ runner.os }}-${{ matrix.target }}-v2-${{ hashFiles('.craft.ini') }}
          restore-keys: |
            craft-${{ runner.os }}-${{ matrix.target }}-v2-

      # -----------------------------------------------------------------------
      # Clear Android environment (Linux only)
      # GitHub runners have Android SDK which confuses CraftMaster's platform detection
      # Note: We move the SDK but DON'T set env vars to empty - that's worse than not setting them
      # The actual unsetting happens in PowerShell steps via Remove-Item Env:VAR
      # -----------------------------------------------------------------------
      - name: Clear Android environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Moving Android SDK out of the way to prevent path-based detection..."
          # Move Android SDK out of the way (can't delete, might be needed by other jobs)
          if [ -d "$ANDROID_HOME" ]; then
            echo "Moving $ANDROID_HOME to /tmp/android-sdk-backup"
            sudo mv "$ANDROID_HOME" /tmp/android-sdk-backup || true
          fi
          if [ -d "$ANDROID_SDK_ROOT" ] && [ "$ANDROID_SDK_ROOT" != "$ANDROID_HOME" ]; then
            sudo mv "$ANDROID_SDK_ROOT" /tmp/android-sdk-root-backup || true
          fi
          # Note: Do NOT set ANDROID_* vars to empty via GITHUB_ENV - that makes them exist
          # as empty strings, and Python's "VAR" in os.environ returns True for empty strings

      # -----------------------------------------------------------------------
      # Install Linux build dependencies
      # -----------------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libfuse2 \
            fuse \
            file \
            patchelf \
            desktop-file-utils \
            libgdk-pixbuf2.0-dev \
            librsvg2-dev \
            zsync \
            libxcb1-dev \
            libxcb-util-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-cursor-dev \
            libxcb-xinput-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-dpms0-dev \
            libxcb-ewmh-dev \
            libxcb-glx0-dev \
            libxcb-present-dev \
            libxcb-record0-dev \
            libxcb-res0-dev \
            libxcb-screensaver0-dev \
            libxcb-xf86dri0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libwayland-egl1-mesa \
            libinput-dev \
            libdrm-dev \
            libgbm-dev \
            libpulse-dev \
            libasound2-dev \
            libcrypt1 \
            libcups2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libicu-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libsqlite3-dev \
            libpcre2-dev \
            libglib2.0-dev \
            libsysprof-capture-4-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxi-dev \
            libxrender-dev \
            libxrandr-dev

      # -----------------------------------------------------------------------
      # Clone CraftMaster
      # -----------------------------------------------------------------------
      - name: Clone CraftMaster
        run: |
          git clone --depth=1 https://invent.kde.org/kde/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

      # -----------------------------------------------------------------------
      # Setup Craft environment
      # -----------------------------------------------------------------------
      - name: Craft setup
        run: |
          New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" --setup

      # -----------------------------------------------------------------------
      # Add KDE blueprints repository
      # -----------------------------------------------------------------------
      - name: Add blueprint repository
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" -c craft/craft-blueprints-kde

      # -----------------------------------------------------------------------
      # Configure source directory override
      # -----------------------------------------------------------------------
      - name: Configure Kdenlive source
        run: |
          # Point Craft to use our checked-out source instead of fetching from upstream
          & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" -c --set srcDir="$env:GITHUB_WORKSPACE" kde/kdemultimedia/kdenlive

      # -----------------------------------------------------------------------
      # Craft blueprint option overrides (Linux only)
      # -----------------------------------------------------------------------
      # pulseaudio is not in KDE's binary cache, so it always builds from source;
      # the blueprint's default (man pages) breaks the build, so disable them.
      # NOTE: qtbase/qttools must NOT be overridden: Craft compares the package
      # config against KDE's cache manifest and falls back to source builds on
      # any mismatch (withAccessibility/args), which produced ABI-inconsistent
      # Qt trees (source qtbase without accessibility vs cached qtdeclarative).
      - name: Override blueprint options
        if: matrix.target == 'linux-64-gcc'
        shell: bash
        run: |
          f="$HOME/craft/CraftMaster/linux-64-gcc/etc/BlueprintSettings.ini"
          mkdir -p "$(dirname "$f")"
          set_opt() {
            section="$1"; key="$2"; value="$3"
            if [ -f "$f" ] && grep -q "^\[${section}\]" "$f"; then
              # Section exists (craft persists registered options): set/update the key inside it
              awk -v sec="$section" -v k="$key" -v v="$value" '
                BEGIN { ins = 0; done = 0 }
                /^\[/ { if (ins && !done) { print k " = " v; done = 1 } ins = 0 }
                $0 ~ "^\\[" sec "\\]$" { ins = 1 }
                ins && $0 ~ "^" k "[[:space:]]*=" { print k " = " v; done = 1; next }
                { print }
                END { if (ins && !done) print k " = " v }
              ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            else
              printf '[%s]\n%s = %s\n' "$section" "$key" "$value" >> "$f"
            fi
          }
          set_opt libs/pulseaudio args "-Dman=false"
          grep -A3 '^\[libs/' "$f"
          # bigsh0t: bitbucket.org blocks wget's TLS fingerprint (404), so
          # pre-seed craft's download cache with the mirror tarball (SHA256
          # 001ed35e... matches the blueprint's targetDigest). Craft skips its
          # own fetch when the archive is already present.
          mkdir -p "$HOME/craft/CraftMaster/downloads/archives/libs/frei0r-bigsh0t"
          curl -sSL -o "$HOME/craft/CraftMaster/downloads/archives/libs/frei0r-bigsh0t/2.6.tar.bz2" \
            "https://github.com/Rusbelito/kdenlive/releases/download/bigsh0t-2.6-mirror/bigsh0t-2.6.tar.bz2"
          sha256sum "$HOME/craft/CraftMaster/downloads/archives/libs/frei0r-bigsh0t/2.6.tar.bz2"
          # pulseaudio: www.freedesktop.org returns 418 'I'm a teapot' to GitHub
          # runner IPs (anti-bot), so pre-seed craft's download cache with the
          # byte-identical mirror tarball (SHA256 0167649c... matches the
          # blueprint's targetDigest for pulseaudio 17.0). Craft skips its own
          # fetch when the archive is already present.
          mkdir -p "$HOME/craft/CraftMaster/downloads/archives/libs/pulseaudio"
          curl -sSL -o "$HOME/craft/CraftMaster/downloads/archives/libs/pulseaudio/pulseaudio-17.0.tar.gz" \
            "https://github.com/Rusbelito/kdenlive/releases/download/pulseaudio-17.0-mirror/pulseaudio-17.0.tar.gz"
          echo "0167649c734fc38f72034036d87dd8b27430a0f40d47fca36b1136714ff0e1cc  $HOME/craft/CraftMaster/downloads/archives/libs/pulseaudio/pulseaudio-17.0.tar.gz" | sha256sum -c -

      # -----------------------------------------------------------------------
      # Prepare build environment
      # -----------------------------------------------------------------------
      - name: Prepare build environment
        run: |
          New-Item -ItemType Directory "$env:GITHUB_WORKSPACE/binaries/" -ErrorAction SilentlyContinue

          # Install packaging tools
          if ($IsWindows) {
              & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" -c dev-utils/nsis
          } elseif ($IsLinux) {
              & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" -c dev-utils/linuxdeploy
          }

      # -----------------------------------------------------------------------
      # Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" -c --install-deps kde/kdemultimedia/kdenlive

      # -----------------------------------------------------------------------
      # Stage Craft downloads cache
      # -----------------------------------------------------------------------
      # Copy craft's download cache (all source tarballs) into ~/cache so the
      # GitHub Actions cache stores it and future runs restore the archives.
      # With every tarball present, craft never fetches from the internet, which
      # makes the build immune to host-level blocking (freedesktop.org 418).
      - name: Stage Craft downloads cache
        run: |
          New-Item -ItemType Directory -Force "$env:HOME/cache" | Out-Null
          Copy-Item -Path "$env:HOME/craft/CraftMaster/downloads/*" -Destination "$env:HOME/cache/" -Recurse -Force

      # -----------------------------------------------------------------------
      # Build Kdenlive
      # -----------------------------------------------------------------------
      - name: Build Kdenlive
        run: |
          # Build with RPC enabled (default in our fork)
          & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" -c --no-cache kde/kdemultimedia/kdenlive

      # -----------------------------------------------------------------------
      # Run tests
      # -----------------------------------------------------------------------
      - name: Run tests
        env:
          # Headless runners have no X display; tests abort at startup with
          # "qt.qpa.xcb: could not connect to display" otherwise.
          QT_QPA_PLATFORM: offscreen
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" -c --test kde/kdemultimedia/kdenlive
        continue-on-error: true   # Don't fail build on test failures (for now)

      # -----------------------------------------------------------------------
      # Pre-seed system libs for linuxdeploy (Linux only)
      # -----------------------------------------------------------------------
      # The KDE binary cache's libcupsimage.so.2 NEEDs libcrypt.so.2, but
      # Ubuntu 24.04 (noble) does not ship it (libcrypt1 only has .so.1), so
      # linuxdeploy cannot deploy it. Build libxcrypt (same 4.4.36 version as
      # noble's libcrypt1) from the release tarball with the new ABI only
      # (--disable-obsolete-api gives libcrypt.so.2) and pre-seed the lib
      # into every location Craft may stage the appdir from.
      - name: Pre-seed libcrypt for linuxdeploy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/libxcrypt.tar.xz \
            "https://github.com/besser82/libxcrypt/releases/download/v4.4.36/libxcrypt-4.4.36.tar.xz"
          tar -C /tmp -xf /tmp/libxcrypt.tar.xz
          cd /tmp/libxcrypt-4.4.36
          ./configure --prefix=/tmp/libxcrypt/out --disable-obsolete-api >/dev/null
          make -j2 >/dev/null
          make install >/dev/null
          lib=$(find /tmp/libxcrypt/out -name 'libcrypt.so.2*' -type f | head -1)
          [ -n "$lib" ] || { echo "ERROR: libcrypt.so.2 build failed"; exit 1; }
          echo "Built $lib"
          prefix="$HOME/craft/CraftMaster/linux-64-gcc"
          img=$(ls -d "$prefix/build/kde/kdemultimedia/kdenlive/image-RelWithDebInfo-"* | head -1)
          [ -n "$img" ] || { echo "ERROR: kdenlive image dir not found"; exit 1; }
          for dest in \
            "$img/usr/lib" \
            "$img/home/runner/craft/CraftMaster/linux-64-gcc/usr/lib" \
            "$prefix/build/kde/kdemultimedia/kdenlive/archive/usr/lib"; do
            mkdir -p "$dest"
            cp -f "$lib" "$dest/libcrypt.so.2"
            echo "Seeded libcrypt.so.2 -> $dest"
          done

      # -----------------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------------
      - name: Create package
        run: |
          & "$env:GITHUB_WORKSPACE/.github/workflows/.craft.ps1" -c --package kde/kdemultimedia/kdenlive

      # -----------------------------------------------------------------------
      # Collect artifacts
      # -----------------------------------------------------------------------
      - name: Collect artifacts
        run: |
          # Copy built packages to artifacts directory
          Copy-Item "$env:HOME/craft/binaries/*" "$env:GITHUB_WORKSPACE/binaries/" -ErrorAction SilentlyContinue -Recurse

          # List what we built
          Write-Host "Built artifacts:"
          Get-ChildItem "$env:GITHUB_WORKSPACE/binaries/" -Recurse | ForEach-Object { Write-Host "  $_" }

      # -----------------------------------------------------------------------
      # Upload artifacts
      # -----------------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kdenlive-websocket-${{ matrix.name }}
          path: ${{ github.workspace }}/binaries/*
          retention-days: 30

  # ===========================================================================
  # Release Job - Create GitHub Release on tag push
  # ===========================================================================
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write           # Required to create releases

    steps:
      # -----------------------------------------------------------------------
      # Download all build artifacts
      # -----------------------------------------------------------------------
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: kdenlive-websocket-windows-x86_64
          path: release/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: kdenlive-websocket-linux-x86_64
          path: release/linux

      # -----------------------------------------------------------------------
      # Prepare release files
      # -----------------------------------------------------------------------
      - name: Prepare release files
        shell: bash   # bash syntax; workflow default is pwsh
        run: |
          mkdir -p release/final

          # Get version from tag
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          # Find and rename artifacts with version
          find release/windows -name "*.exe" -exec cp {} "release/final/Kdenlive-WebSocket-${VERSION}-x86_64-setup.exe" \;
          find release/linux -name "*.AppImage" -exec cp {} "release/final/Kdenlive-WebSocket-${VERSION}-x86_64.AppImage" \;

          # Make AppImage executable
          chmod +x release/final/*.AppImage 2>/dev/null || true

          # List final release files
          echo "Release files:"
          ls -la release/final/

      # -----------------------------------------------------------------------
      # Create GitHub Release
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Kdenlive WebSocket ${{ env.VERSION }}
          body: |
            ## Kdenlive WebSocket Fork - ${{ env.VERSION }}

            This release includes JSON-RPC WebSocket support for automation.

            ### Downloads
            - **Windows**: `Kdenlive-WebSocket-${{ env.VERSION }}-x86_64-setup.exe`
            - **Linux**: `Kdenlive-WebSocket-${{ env.VERSION }}-x86_64.AppImage`

            ### WebSocket RPC
            - Default port: `9876`
            - Connect: `ws://localhost:9876`
            - Documentation: See `dev-docs/rpc-api.md`

            ### Notes
            - Artifacts are unsigned (code signing planned for future releases)
            - Report issues: https://github.com/IO-AtelierTech/kdenlive/issues
          files: release/final/*
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
