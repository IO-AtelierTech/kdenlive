#
# CI-specific Craft overrides for GitHub Actions
# These settings apply on top of the main .craft.ini

[GeneralSettings]
# Don't create cache files in CI (we use KDE's public cache)
Packager/CreateCache = False

[BlueprintSettings]
# Skip packages not needed in CI or that cause issues

# Python 2 deprecated - skip breakpad tools that need it
dev-utils/python2.ignored = True
dev-utils/breakpad-tools.ignored = True

# Note: msys is NOT ignored - Craft needs it for AutoTools packages on Windows

# gtk-doc pulls uncached lxml which takes too long to build
dev-utils/gtk-doc.ignored = True
