#
# Craft configuration for Kdenlive WebSocket Fork
# Based on ownCloud client pattern: https://github.com/owncloud/client

[General]
Branch = feature/websocket
ShallowClone = False

[Variables]
# Cache settings - use KDE cache, don't create (read-only)
UseCache = True
CreateCache = False

# Version info
KdenliveVersion = 25.04-websocket
QtVersion = 6.8.3
CachePatchLvl = 0

# Workspace - set by CI, fallback to local
WORKSPACE = ${Variables:Root}
CiBuild = True

[GeneralSettings]
Version/ConfigVersion = 6

# Packager settings
Packager/Destination = ${Variables:WORKSPACE}/binaries
Paths/DownloadDir = ${Variables:Root}/downloads
Packager/CacheDir = ${Variables:WORKSPACE}/cache
Packager/UseCache = ${Variables:UseCache}
Packager/CreateCache = ${Variables:CreateCache}
Packager/CacheVersion = ${Variables:KdenliveVersion}/Qt_${Variables:QtVersion}_${Variables:CachePatchLvl}
Packager/PackageDebugSymbols = False

# Use official KDE craft cache
Packager/RepositoryUrl = https://files.kde.org/craft/

# Build settings
Compile/BuildType = RelWithDebInfo
ContinuousIntegration/Enabled = ${Variables:CiBuild}
ContinuousIntegration/UpdateRepository = True

# Code signing - disabled for now, documented for future
CodeSigning/Enabled = ${Env:SIGN_PACKAGE}
CodeSigning/Protected = True
# Future requirements:
# - Windows: EV code signing certificate for SmartScreen trust
# - macOS: Apple Developer ID + notarization (CodeSigning/MacDeveloperId)
# - Secrets: CRAFT_CODESIGN_CERTIFICATE, CRAFT_CODESIGN_PASSWORD

[BlueprintSettings]
# Use official KDE blueprints with Qt 6.8
libs/qt6.version = ${Variables:QtVersion}

# Skip packages not needed for our builds
binary/mysql.ignored = True

# Kdenlive-specific: ensure WebSockets support
libs/qt6/qtwebsockets.ignored = False

# -------------------------------------------------------------------------
# Target-specific configurations
# -------------------------------------------------------------------------

[windows-cl-msvc2022-x86_64]
General/ABI = windows-cl-msvc2022-x86_64

[windows-cl-msvc2022-x86_64-BlueprintSettings]
# Windows-specific blueprint overrides (if any)

[linux-64-gcc]
General/ABI = linux-64-gcc

[linux-64-gcc-BlueprintSettings]
# Linux needs DBus for proper integration
libs/dbus.ignored = False

# -------------------------------------------------------------------------
# Environment variables
# -------------------------------------------------------------------------

[Env]
# Code signing defaults (override in CI secrets)
SIGN_PACKAGE = False
CRAFT_CODESIGN_CERTIFICATE =
